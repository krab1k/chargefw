[build-system]
requires = ["nanobind>=2.11", "scikit-build-core>=1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "chargefw"
dynamic = ["version"]
description = "Empirical partial atomic charge calculation framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]
license = { text = "MIT" }
authors = [{ name = "ChargeFW contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
Repository = "https://github.com/krab1k/chargefw"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/python/{wheel_tag}"
build.verbose = false
logging.level = "WARNING"
install.components = ["python"]
wheel.packages = ["python/chargefw"]

[tool.scikit-build.cmake.define]
CHARGEFW_BUILD_CLI = "OFF"
CHARGEFW_BUILD_PYTHON = "ON"
CHARGEFW_BUILD_TESTS = "OFF"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "CMakeLists.txt"
regex = '(?is)project\s*\(\s*chargefw\s+VERSION\s+(?P<value>[0-9]+\.[0-9]+(?:\.[0-9]+)?)'

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["C4", "E4", "E7", "E9", "F", "I", "SIM", "UP"]
